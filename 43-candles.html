<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<title>Queen B — 43 Candles</title>
<style>
:root{--gold:#f4d477;--deep:#09000f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#050007;color:#fff;font-family:Inter,system-ui,sans-serif}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 68%,#55206f 0,#1c0825 38%,#070009 72%)}
#title{position:absolute;z-index:40;left:16px;right:16px;top:max(18px,env(safe-area-inset-top));text-align:center;pointer-events:none}
#title small{display:block;color:var(--gold);font-size:10px;letter-spacing:.28em;font-weight:800}
#title h1{font:700 clamp(36px,9vw,64px)/.9 Georgia,serif;margin:8px 0 4px}
#title p{margin:0;font-size:13px;opacity:.72}
#cake{position:absolute;z-index:5;left:50%;top:58%;transform:translate(-50%,-50%);width:min(92vw,560px);height:min(74vh,650px)}
.base{pointer-events:none;position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:88%;height:35%;border-radius:50%/20%;background:linear-gradient(#fff2ff 0 14%,#d47bdc 15% 38%,#8f3d9d 39% 62%,#53155f 63%);box-shadow:inset 0 12px 22px #fff7,inset 0 -20px 32px #26002e,0 36px 70px #000b}
.top{pointer-events:none;position:absolute;left:50%;bottom:34%;transform:translateX(-50%);width:69%;height:25%;border-radius:50%/20%;background:linear-gradient(#fff4ff 0 15%,#d980e1 16% 46%,#762680 47%);box-shadow:inset 0 10px 18px #fff6,inset 0 -15px 24px #2a0030}
.crown{pointer-events:none;position:absolute;left:50%;top:7%;transform:translateX(-50%);font-size:46px;filter:drop-shadow(0 0 18px #f4d47788)}
#candles{position:absolute;inset:0;z-index:30}
.candle{position:absolute;width:58px;height:86px;margin:-43px 0 0 -29px;border:0;background:transparent;padding:0;cursor:pointer;touch-action:manipulation;z-index:35}
.candle .stick{position:absolute;left:23px;bottom:0;width:12px;height:38px;border-radius:7px;background:repeating-linear-gradient(45deg,#fff1b6 0 6px,#a34ab1 6px 12px)}
.candle .flame{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:18px;height:27px;border-radius:65% 35% 60% 40%;background:radial-gradient(circle at 50% 65%,#fff6a6 0 20%,#ffb31f 21% 56%,#ff5f22 57%);filter:drop-shadow(0 0 14px #ff8d24);animation:f .75s infinite alternate}
@keyframes f{to{transform:translateX(-50%) scale(.82,1.15) rotate(5deg)}}
.candle .n{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);font-size:9px;color:#ffe9a8;background:#100016cc;padding:3px 6px;border-radius:999px;border:1px solid #f4d47755}
.candle.done{opacity:.26}.candle.done .flame{display:none}.candle.done .n{opacity:.5}
#status{position:absolute;z-index:45;left:14px;bottom:max(14px,env(safe-area-inset-bottom));padding:10px 13px;border-radius:999px;background:#09000dcc;border:1px solid #ffffff25;font-size:11px;letter-spacing:.08em}
#memory{position:absolute;inset:0;z-index:80;display:none;place-items:center;background:#070009ee;backdrop-filter:blur(8px)}
#memory.show{display:grid}
#photos{position:relative;width:94vw;height:72vh}
#photos img{position:absolute;left:50%;top:49%;max-width:72vw;max-height:55vh;object-fit:contain;border:8px solid #fff8ef;border-radius:12px;box-shadow:0 35px 110px #000d,0 0 45px #d79bff33}
#photos img:nth-child(1){transform:translate(-58%,-50%) rotate(-5deg)}
#photos img:nth-child(2){transform:translate(-42%,-50%) rotate(5deg)}
#photos img:nth-child(3){transform:translate(-50%,-42%) rotate(0deg)}
#memoryCaption{position:absolute;left:0;right:0;bottom:9%;text-align:center;font:700 18px Georgia,serif;color:#ffe6a0}
#closeMemory{position:absolute;z-index:2;left:50%;bottom:18px;transform:translateX(-50%);min-width:230px;min-height:58px;border-radius:999px;border:1px solid var(--gold);background:#ffffff10;color:#ffe9a5;font-weight:800}
#message,#video{position:absolute;inset:0;z-index:100;display:none;place-items:center;text-align:center;padding:26px;background:radial-gradient(circle at 50% 42%,#5b1b76,#15031d 46%,#030004 78%)}
#message.show,#video.show{display:grid}
#message h2{font:700 clamp(46px,12vw,84px)/.9 Georgia,serif;margin:12px 0 18px}
#message p{font:25px/1.5 Georgia,serif;margin:0 0 28px}
.gold{color:var(--gold)}
#showVideo{min-width:240px;min-height:62px;border:1px solid var(--gold);border-radius:999px;background:#ffffff10;color:#ffe9a5;font-weight:800}
video{width:min(96vw,900px);max-height:78vh;background:#000;border-radius:18px}
.end{font:22px/1.45 Georgia,serif;margin-top:18px}
</style>
</head>

  <div id="message">

      <div style="font-size:50px">♛</div>
      <small style="color:var(--gold);letter-spacing:.25em">43 CANDLES · 100 MEMORIES</small>
      <h2>HAPPY BIRTHDAY,<br><span class="gold">BEAUX.</span></h2>
      <p>Happy birthday, Sis. ❤️<br>— Kimmy</p>
      <button id="showVideo">ONE MORE THING… ▶</button>
    </div>
  </div>

  <div id="video">
    <div>
      <video id="vid" controls playsinline preload="metadata"><source src="./VID-20260915-WA0000.mp4" type="video/mp4"></video>
      <div class="end">HAPPY BIRTHDAY, BEAUX. 👑<br><span class="gold">43 candles. 100 memories.</span><br>— Kimmy ❤️</div>
    </div>
  </div>
</div>

const candles=document.getElementById("candles");
const memory=document.getElementById("memory");
const photos=document.getElementById("photos");
const caption=document.getElementById("memoryCaption");
const status=document.getElementById("status");
const opened=new Set();

function pos(i){
  const rows=[
    {start:0,count:15,rx:35,ry:18,cy:52},
    {start:15,count:14,rx:26,ry:14,cy:52},
    {start:29,count:14,rx:17,ry:10,cy:52}
  ];
  const row=rows.find(r=>i>=r.start&&i<r.start+r.count);
  const j=i-row.start;
  const a=-Math.PI/2+(j/row.count)*Math.PI*2;
  return {x:50+Math.cos(a)*row.rx,y:row.cy+Math.sin(a)*row.ry};
}

function openOne(i,button){
  if(opened.has(i)) return;
  opened.add(i);
  button.classList.add("done");
  photos.innerHTML="";
  groups[i].forEach(id=>{
    const img=document.createElement("img");
    img.src="https://drive.google.com/thumbnail?id="+id+"&sz=w1600";
    img.alt="Memory";
    photos.appendChild(img);
  });
  caption.textContent="CANDLE "+String(i+1).padStart(2,"0")+" · "+groups[i].length+" MEMORIES";
  status.textContent=opened.size+" / 43 CANDLES";
  memory.classList.add("show");
}

for(let i=0;i<43;i++){
  const p=pos(i);
  const b=document.createElement("button");
  b.type="button"; b.className="candle";
  b.style.left=p.x+"%"; b.style.top=p.y+"%";
  b.innerHTML='<span class="flame"></span><span class="stick"></span><span class="n">'+(i+1)+'</span>';
  b.addEventListener("pointerup",e=>{e.preventDefault();openOne(i,b)});
  b.addEventListener("click",e=>{e.preventDefault();openOne(i,b)});
  candles.appendChild(b);
}

document.getElementById("closeMemory").onclick=()=>{
  memory.classList.remove("show");
  if(opened.size===43) document.getElementById("message").classList.add("show");
};
document.getElementById("showVideo").onclick=()=>{
  document.getElementById("message").classList.remove("show");
  document.getElementById("video").classList.add("show");
  document.getElementById("vid").play().catch(()=>{});
};
</script>
